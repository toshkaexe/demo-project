# Shared settings. Local ones (database, CORS, .env) are in application-local.yaml
spring:
  application:
    name: lavka
  profiles:
    # used only when SPRING_PROFILES_ACTIVE is not set, so running from the IDE needs no setup
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # schema is managed by Liquibase, Hibernate only checks that entities match it
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

springdoc:
  swagger-ui:
    # show the hand-written spec (descriptions, every error code, examples) instead of the one generated from code;
    # the generated one stays at /v3/api-docs
    url: /openapi.yaml

auth:
  jwt:
    # HMAC signing key, at least 32 bytes; comes from the JWT_SECRET env variable (locally also from .env)
    secret: ${JWT_SECRET}
    # short-lived, sent with every request
    access-ttl: 15m
    # long-lived, only used to get a new token pair
    refresh-ttl: 30d
