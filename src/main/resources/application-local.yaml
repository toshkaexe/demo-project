# Local profile: developer machine and docker compose. Active by default.
spring:
  config:
    # local secrets (JWT_SECRET) from .env in the working directory
    import: optional:file:.env[.properties]
  datasource:
    # Postgres from docker-compose.yaml; the app container overrides the host via SPRING_DATASOURCE_URL
    url: jdbc:postgresql://localhost:5432/lavka
    username: lavka
    password: lavka
  web:
    error:
      # show the reason ("Invalid email or password", ...) in error responses
      include-message: always

springdoc:
  # Swagger UI, /v3/api-docs and /openapi.yaml only on a developer machine
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

cors:
  # the frontend dev server
  allowed-origins: http://localhost:3000

logging:
  level:
    demo.lavka: debug
