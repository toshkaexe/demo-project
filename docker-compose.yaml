services:
  postgres:
    image: postgres:18-alpine
    container_name: lavka-postgres
    environment:
      POSTGRES_DB: lavka
      POSTGRES_USER: lavka
      POSTGRES_PASSWORD: lavka
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavka -d lavka"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: lavka-keycloak
    # dev mode: HTTP, no hostname checks, built-in H2 database
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      # 8080 is taken by the application
      - "8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data

volumes:
  postgres-data:
  keycloak-data:
