services:
  postgres:
    image: postgres:18-alpine
    container_name: lavka-postgres
    environment:
      POSTGRES_DB: lavka
      POSTGRES_USER: lavka
      POSTGRES_PASSWORD: lavka
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavka -d lavka"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
