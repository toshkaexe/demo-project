name: Java PR Checker (Maven)

# Бот запускается при создании PR или новых коммитах в PR в ветку main
on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код репозитория
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Java (JDK 21, как в pom.xml)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Компилируем проект и запускаем тесты
      - name: Build and Test with Maven
        run: ./mvnw -B clean verify
