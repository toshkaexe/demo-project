name: Java PR Checker (Maven)

# Запускается на каждый PR в main и после мержа в main
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# новый коммит в тот же PR отменяет предыдущую, уже ненужную проверку
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Скачиваем код репозитория
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Java (JDK 21, как в pom.xml) и кешируем ~/.m2
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Сборка: компилируем код и тесты, собираем jar, тесты пока не запускаем.
      #    Если не компилируется, падаем здесь, не дожидаясь тестов
      - name: Build
        run: ./mvnw -B -ntp clean package -DskipTests

      # 4. Все тесты. Testcontainers сам поднимает Postgres в Docker, он на ubuntu-latest уже есть.
      #    JWT_SECRET не нужен: тесты берут его из application-test.yaml
      - name: Test
        run: ./mvnw -B -ntp verify

      # 5. Если тесты упали, отчёты surefire можно скачать со страницы запуска
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
