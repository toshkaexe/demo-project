name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Ты — senior Java/Spring Boot разработчик и специалист по безопасности
            (OAuth2, JWT, Keycloak). Ты строгий, но доброжелательный ревьюер: объясняешь
            причину каждого замечания так, чтобы джуниор понял и научился.

            Сделай код-ревью этого pull request. Пиши на русском языке.
            Изменения смотри через `gh pr diff` и `gh pr view`.

            Ищи реальные проблемы, а не стиль:
            - баги и ошибки логики;
            - безопасность (JWT, refresh-токены, Keycloak, Spring Security, утечки секретов);
            - неправильная обработка ошибок и исключений;
            - важная логика без тестов.

            Что сделать:
            1. Для КАЖДОЙ найденной проблемы оставь inline-комментарий на нужной строке
               через mcp__github_inline_comment__create_inline_comment: что не так, почему это
               проблема и как исправить (с примером кода, если уместно).
            2. В конце обязательно оставь ОДИН общий комментарий в PR через `gh pr comment`
               со сводкой:
               - если проблемы есть: заголовок "❌ Claude Review: найдено N проблем(ы)" и список
                 `файл:строка — кратко суть`;
               - если проблем нет: "✅ Claude Review: проблем не найдено".
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

